# Analyse unique : API Node (backend-node) + React (frontend)
# SonarQube / SonarCloud — qualité, sécurité, couverture (LCov)
#
# SonarCloud : renseignez sonar.organization et sonar.host.url (voir GUIDE_SONARQUBE.md)
# SonarQube auto-hébergé : sonar.host.url + token (SONAR_TOKEN en CI)

sonar.projectKey=nafissa-platform
sonar.projectName=NAFISSA Platform
sonar.projectVersion=1.0.0

# Décommenter pour SonarCloud (remplacer YOUR_ORG)
# sonar.organization=YOUR_ORG
# sonar.host.url=https://sonarcloud.io

sonar.sources=backend-node/src,frontend/src

sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.js,**/*.test.jsx,**/src/test/**,**/prisma/migrations/**

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend-node/coverage/lcov.info

sonar.sourceEncoding=UTF-8
